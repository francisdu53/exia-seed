name: exia_seed
version: 0.9.1
description: "EXIA SEED — mémoire de Nexa : wiki markdown indexé par graphe associatif, sans vecteurs. 0.9.1 = masques de langue fr/en (0.9.0) + apports de la 0.8.1 (docs/11-12) : fiches d'identité, mots distinctifs, avis système, enveloppes, amorçage ; phase 2 (souvenirs qui remontent) codée, activée par `phase: 2`."
# Informatif : Hermès n'utilise pas cette liste pour filtrer les appels (vérifié le 23/09/2026 dans
# plugins/memory/__init__.py) — il appelle tout crochet implémenté par le fournisseur.
hooks:
  - prefetch
  - sync_turn
  - on_pre_compress
  - on_session_end
  - on_session_switch
  - on_memory_write
  - handle_tool_call
